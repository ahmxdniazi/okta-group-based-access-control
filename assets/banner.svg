<svg viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <!-- Dark background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050d1a"/>
      <stop offset="50%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#0d1f3c"/>
    </linearGradient>
    <!-- Blue accent gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00b4f5"/>
      <stop offset="100%" style="stop-color:#0070f3"/>
    </linearGradient>
    <!-- Cyan glow gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00e5ff"/>
      <stop offset="100%" style="stop-color:#0091ea"/>
    </linearGradient>
    <!-- Orange accent -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35"/>
      <stop offset="100%" style="stop-color:#f7931e"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Subtle glow -->
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Circle clip -->
    <clipPath id="circleClip">
      <circle cx="600" cy="170" r="130"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" fill="url(#bgGrad)"/>

  <!-- Grid lines subtle -->
  <g opacity="0.04" stroke="#00b4f5" stroke-width="1">
    <line x1="0" y1="68" x2="1200" y2="68"/>
    <line x1="0" y1="136" x2="1200" y2="136"/>
    <line x1="0" y1="204" x2="1200" y2="204"/>
    <line x1="0" y1="272" x2="1200" y2="272"/>
    <line x1="120" y1="0" x2="120" y2="340"/>
    <line x1="240" y1="0" x2="240" y2="340"/>
    <line x1="360" y1="0" x2="360" y2="340"/>
    <line x1="480" y1="0" x2="480" y2="340"/>
    <line x1="600" y1="0" x2="600" y2="340"/>
    <line x1="720" y1="0" x2="720" y2="340"/>
    <line x1="840" y1="0" x2="840" y2="340"/>
    <line x1="960" y1="0" x2="960" y2="340"/>
    <line x1="1080" y1="0" x2="1080" y2="340"/>
  </g>

  <!-- Left radial glow -->
  <radialGradient id="leftGlow" cx="20%" cy="50%" r="40%">
    <stop offset="0%" style="stop-color:#0047ab;stop-opacity:0.3"/>
    <stop offset="100%" style="stop-color:#0047ab;stop-opacity:0"/>
  </radialGradient>
  <rect width="1200" height="340" fill="url(#leftGlow)"/>

  <!-- Right radial glow -->
  <radialGradient id="rightGlow" cx="80%" cy="50%" r="40%">
    <stop offset="0%" style="stop-color:#00b4f5;stop-opacity:0.15"/>
    <stop offset="100%" style="stop-color:#00b4f5;stop-opacity:0"/>
  </radialGradient>
  <rect width="1200" height="340" fill="url(#rightGlow)"/>

  <!-- ===== LEFT SIDE — Group/User Nodes ===== -->

  <!-- Connection lines from left nodes to center -->
  <line x1="240" y1="110" x2="490" y2="165" stroke="#00b4f5" stroke-width="1.5" opacity="0.5" stroke-dasharray="6 4"/>
  <line x1="240" y1="230" x2="490" y2="175" stroke="#f7931e" stroke-width="1.5" opacity="0.5" stroke-dasharray="6 4"/>

  <!-- Engineering Group Box -->
  <rect x="80" y="75" width="150" height="70" rx="10" fill="#0a1e3d" stroke="#00b4f5" stroke-width="1.5" opacity="0.9"/>
  <text x="155" y="101" text-anchor="middle" fill="#00b4f5" font-size="10" font-weight="700" letter-spacing="2" opacity="0.8">GROUP</text>
  <text x="155" y="122" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Engineering</text>
  <text x="155" y="138" text-anchor="middle" fill="#8899aa" font-size="9">Ayesha · Sarmad</text>

  <!-- HR Group Box -->
  <rect x="80" y="195" width="150" height="70" rx="10" fill="#0a1e3d" stroke="#f7931e" stroke-width="1.5" opacity="0.9"/>
  <text x="155" y="221" text-anchor="middle" fill="#f7931e" font-size="10" font-weight="700" letter-spacing="2" opacity="0.8">GROUP</text>
  <text x="155" y="242" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">HR</text>
  <text x="155" y="258" text-anchor="middle" fill="#8899aa" font-size="9">Ali · Sajid</text>

  <!-- ===== CENTER — Okta Shield Icon ===== -->

  <!-- Outer ring glow -->
  <circle cx="600" cy="170" r="136" fill="none" stroke="#00b4f5" stroke-width="1" opacity="0.3"/>
  <circle cx="600" cy="170" r="128" fill="none" stroke="#00b4f5" stroke-width="2" opacity="0.6"/>

  <!-- Shield background circle -->
  <circle cx="600" cy="170" r="118" fill="#0a1628" opacity="0.95"/>

  <!-- Okta-style shield -->
  <path d="M600 88 L650 108 L670 155 L650 205 L600 225 L550 205 L530 155 L550 108 Z" 
        fill="none" stroke="url(#blueGrad)" stroke-width="2.5" opacity="0.9" filter="url(#softGlow)"/>
  <path d="M600 100 L642 117 L659 158 L642 198 L600 215 L558 198 L541 158 L558 117 Z" 
        fill="#0d2040" opacity="0.8"/>

  <!-- Lock icon inside shield -->
  <rect x="582" y="152" width="36" height="28" rx="4" fill="url(#blueGrad)" opacity="0.9"/>
  <path d="M590 152 L590 144 C590 136 610 136 610 144 L610 152" 
        fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="600" cy="166" r="4" fill="#ffffff"/>
  <rect x="598.5" y="166" width="3" height="7" rx="1" fill="#ffffff"/>

  <!-- Okta wordmark below shield in circle -->
  <text x="600" y="240" text-anchor="middle" fill="#00b4f5" font-size="11" font-weight="700" letter-spacing="3" opacity="0.8">OKTA IAM</text>

  <!-- ===== RIGHT SIDE — App nodes ===== -->

  <!-- Connection lines from center to right apps -->
  <line x1="710" y1="165" x2="950" y2="110" stroke="#00b4f5" stroke-width="1.5" opacity="0.5" stroke-dasharray="6 4"/>
  <line x1="710" y1="175" x2="950" y2="230" stroke="#f7931e" stroke-width="1.5" opacity="0.5" stroke-dasharray="6 4"/>

  <!-- Cyber Engineering App Box -->
  <rect x="950" y="75" width="170" height="70" rx="10" fill="#0a1e3d" stroke="#00b4f5" stroke-width="1.5" opacity="0.9"/>
  <text x="1035" y="101" text-anchor="middle" fill="#00b4f5" font-size="10" font-weight="700" letter-spacing="2" opacity="0.8">APP</text>
  <text x="1035" y="118" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Cyber</text>
  <text x="1035" y="134" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Engineering</text>

  <!-- HR Force App Box -->
  <rect x="950" y="195" width="170" height="70" rx="10" fill="#0a1e3d" stroke="#f7931e" stroke-width="1.5" opacity="0.9"/>
  <text x="1035" y="221" text-anchor="middle" fill="#f7931e" font-size="10" font-weight="700" letter-spacing="2" opacity="0.8">APP</text>
  <text x="1035" y="242" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">HR Force</text>

  <!-- ===== TOP TEXT ===== -->
  <!-- Main Title -->
  <text x="600" y="36" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="800" letter-spacing="1" filter="url(#softGlow)">Okta Groups &amp; Application Access Control</text>

  <!-- Subtitle -->
  <text x="600" y="310" text-anchor="middle" fill="#6688aa" font-size="13" letter-spacing="2">Identity &amp; Access Management  ·  Group-Based Access Control  ·  SAML 2.0  ·  SSO</text>

  <!-- Decorative top line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#blueGrad)"/>
  <!-- Decorative bottom line -->
  <rect x="0" y="337" width="1200" height="3" fill="url(#orangeGrad)"/>

  <!-- Corner accents -->
  <rect x="0" y="0" width="3" height="80" fill="url(#blueGrad)" opacity="0.6"/>
  <rect x="1197" y="0" width="3" height="80" fill="url(#orangeGrad)" opacity="0.6"/>
</svg>
